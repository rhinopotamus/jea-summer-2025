<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Growth Factor Formula</span></h2>
<div class="para logical">
<div class="para">If a quantity is growing (or decaying) exponentially, then the growth (or decay) factor is</div>
<div class="displaymath process-math">
\begin{equation*}
\displaystyle g = \sqrt[t]{\frac{a}{s}}\text{,}
\end{equation*}
</div>
<div class="para">where <span class="process-math">\(s\)</span> is the starting amount and <span class="process-math">\(a\)</span> is the amount after <span class="process-math">\(t\)</span> time periods.</div>
